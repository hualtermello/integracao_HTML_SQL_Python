<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro Clientes</title>
</head>
<body>
    <h1>Cadastro de Cliente</h1>
    <form action="/cadastrar" method="POST" id="cadastro">
        <label for="c_cpf">CPF</label>
        <input type="text" name="cpf" id="c_cpf" required>

        <label for="c_primeiro_nome">Primeiro Nome</label>
        <input type="text" name="primeiro_nome" id="c_primeiro_nome" required>

        <label for="c_sobrenome">Sobrenome</label>
        <input type="text" name="sobrenome" id="c_sobrenome" required>

        <label for="c_idade">Idade</label>
        <input type="number" name="idade" id="c_idade" required>

        <button type="submit">Cadastrar</button>

    </form>
    <h2>Lista de Clientes</h2>

    <table>
        <thead>
            <th>CPF</th>
            <th>Primeiro_Nome</th>
            <th>Sobrenome</th>
            <th>Idade</th>
        </thead>
        <tbody>
            {% for cliente in clientes %}
                <tr>
                    <td>{{cliente.cpf}}</td>
                    <td>{{cliente.primeiro_nome}}</td>
                    <td>{{cliente.sobrenome}}</td>
                    <td>{{cliente.idade}}</td>
                    <td> <!-- CORRIGIDO: O botão de excluir agora está dentro da linha correta -->
                        <a href="{{url_for('excluir', cpf=cliente.cpf)}}"
                           onclick="return confirm('Deseja remover este cliente?')">
                           Excluir
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
